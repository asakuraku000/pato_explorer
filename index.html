<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pato Explorer</title>

  <meta name="description" content="PATO Explorer is a story-driven 2D exploration game that brings the history and culture of Pateros to life. Meet NPCs based on real historical figures, explore the town, and piece together its heritage journal one chapter at a time." />
  <meta name="theme-color" content="#1a1206" />

  <!-- Open Graph (Facebook, Discord, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pato Explorer" />
  <meta property="og:description" content="A story-driven 2D exploration game about the history and culture of Pateros — meet local figures, explore the town, and piece together its heritage one chapter at a time." />
  <meta property="og:image" content="assets/apple-touch-icon.png" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Pato Explorer" />
  <meta name="twitter:description" content="A story-driven 2D exploration game about the history and culture of Pateros." />

  <script src="js/scenes/AboutScene.js"></script>
  <script src="js/scenes/SettingsScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/Chapter1Scene.js"></script>
  <script src="js/scenes/Chapter2Scene.js"></script>

  <script src="js/main.js"></script>

</html>
